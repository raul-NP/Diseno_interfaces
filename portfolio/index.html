<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PORTFOLIO</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="./img/logo.png" type="image/x-icon">
</head>
<body>
    
    <!-- Menú -->
    <header id="menu-container">

        <div id="pages1">
            <div class="page-container">
                <div id="page-home" class="selected">Home</div>
            </div>
            <div class="page-container">
                <div id="page-about">About</div>
            </div>
        </div>

        <div id="logo">
            <img id="logo-img" src="./img/logo.png" alt="">
        </div>
        
        <div id="pages2">
            <div class="page-container">
                <div id="page-projects">Projects</div>
            </div>
            <div class="page-container">
                <div id="page-career">Career</div>
            </div>
        </div>

    </header>

    <!-- Contenedor del contenido -->
    <div id="container">
        
        <div id="home">
            <!-- Junior full stack developer -->
            <h1>Home</h1>
        </div>
        
        <div id="about">
            <!-- Temas personales  -->
            <h1>About</h1>
        </div>

        <div id="projects">
            <!-- Proyectos en general -->
            <h1>Projects</h1>
        </div> 
    
        <div id="career">
            <!-- Lenguajes, tecnologías -->
            <h1>Career</h1>
        </div>

    </div>

    <!-- Pie de página -->
    <footer id="footer">


        
    </footer>

    <!-- Número y barras de carga -->
    <div id="charge-bar-container">
        <div id="charge-bar"></div>
    </div>
    <div id="charge-num-container">
        <p id="charge-num"></p>
    </div>

    <!-- Cursor de la página -->
    <div id="cursor">
        <div id="cruz-y"></div>
        <div id="cruz-x"></div>
    </div>

    <!-- JS enlazado -->
    <script src="main.js"></script>
    
</body>
</html>
