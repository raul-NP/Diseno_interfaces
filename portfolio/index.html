<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PORTFOLIO</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="./img/logo.png" type="image/x-icon">
</head>
<body>
    
    <!-- Menú -->
    <header id="menu-container">

        <div id="pages1">
            <div id="page-home-container">
                <div id="page-home">
                    <img src="" alt="">Home
                </div>
            </div>
            <div id="page-about-container">
                <div id="page-about">
                    <img src="" alt="">About
                </div>
            </div>
        </div>
        <div id="logo">
            <img src="./img/logo.png" alt="">
        </div>
        <div id="pages2">
            <div id="page-projects">
                <img src="" alt="">Projects
            </div>
            <div id="page-career">
                <img src="" alt="">Career
            </div>
        </div>

    </header>

    <!-- Contenedor del contenido -->
    <div id="container">
        
        <!-- Home (Resúmen) -->
        <div id="home">
            
        </div>

        <!-- Proyectos -->
        <div id="projects">

        </div>
    
        <!-- About -->
        <div id="about">

        </div>
    
        <!-- Estudios -->
        <div id="career">

        </div>

    </div>

    <!-- Número y barras de carga -->
    <div id="charge-bar-container">
        <div id="charge-bar"></div>
    </div>
    <div id="charge-num-container">
        <p id="charge-num"></p>
    </div>

    <!-- Cursor de la página -->
    <!-- <img src="" id="cursor"></img> -->
    <div id="cursor">
        <div id="cruz-y"></div>
        <div id="cruz-x"></div>
    </div>

    <!-- JS enlazado -->
    <script src="main.js"></script>
    
</body>
</html>
